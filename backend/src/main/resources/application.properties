# ------------------------------------------
# APPLICATION INFO
# ------------------------------------------
spring.application.name=drivingschool
server.port=8080

# ------------------------------------------
# DATASOURCE (MySQL)
# ------------------------------------------
#spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.username=${MYSQL_USER}
#spring.datasource.password=${MYSQL_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.api.url=https://graph.facebook.com/v20.0/
# ------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Use this single dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------
# JWT CONFIGURATION
# ------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ------------------------------------------
# OPTIONAL EXTERNAL API
# ------------------------------------------
ors.api.key=${ORS_API_KEY:}



# ------------------------------------------
# LOGGING
# ------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.example=DEBUG
